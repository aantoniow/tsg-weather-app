version: '3.8'

services:
  redis:
    image: redis:7
    ports:
      - 6379:6379

  app:
    build:
      context: ..  # Parent dir (root projektu, gdzie pom.xml i src)
      dockerfile: docker/Dockerfile
    depends_on:
      - redis
    ports:
      - "8080:8080"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379